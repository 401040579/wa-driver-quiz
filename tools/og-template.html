<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<title>og template</title>
<style>
  html,body{margin:0;padding:0}
  body{width:1200px;height:630px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
    background:linear-gradient(120deg,#0b6b3a 0%,#12894b 38%,#1f4e79 100%);color:#fff;position:relative;-webkit-font-smoothing:antialiased}
  .glow{position:absolute;right:-140px;top:-160px;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),rgba(255,255,255,0) 68%)}
  .wrap{position:absolute;left:72px;top:64px;right:72px;bottom:56px}
  .brand{display:flex;align-items:center;gap:18px;font-size:26px;font-weight:600;letter-spacing:.5px;opacity:.95}
  .brand img{width:56px;height:56px;border-radius:13px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  h1{margin:46px 0 0;font-size:70px;line-height:1.1;font-weight:800;letter-spacing:1px;text-shadow:0 2px 10px rgba(0,0,0,.18)}
  h1 small{display:block;font-size:31px;font-weight:600;margin-top:14px;opacity:.95;white-space:nowrap;letter-spacing:0}
  .en{margin-top:14px;font-size:26px;font-weight:500;opacity:.88;letter-spacing:.3px}
  .chips{position:absolute;left:0;bottom:74px;display:flex;gap:14px;flex-wrap:wrap}
  .chip{font-size:22px;font-weight:600;padding:8px 18px;border-radius:999px;background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.42);backdrop-filter:blur(2px)}
  .url{position:absolute;right:0;bottom:4px;font-size:24px;font-weight:600;opacity:.85;letter-spacing:.3px}
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <div class="brand"><img src="../favicon.svg" alt=""> 免费 · 无需注册 · 手机电脑均可用</div>
    <h1>华盛顿州驾照笔试<br>中文练习题库<small>313 道选择题 · 依据 WA DOL 官方《华盛顿驾驶指南》整理</small></h1>
    <div class="en">Washington DOL Knowledge Test Practice in Chinese</div>
    <div class="chips">
      <span class="chip">官方指南标志配图</span>
      <span class="chip">即时讲解</span>
      <span class="chip">40 题模拟考试</span>
      <span class="chip">错题本 · 收藏夹</span>
    </div>
    <div class="url">401040579.github.io/wa-driver-quiz</div>
  </div>
</body>
</html>
